AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Three EC2 instances behind an Application Load Balancer
  for testing round-robin load balancing.

Parameters:

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type

  AmazonLinuxAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  ############################################################
  # VPC
  ############################################################

  DemoVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: load-balancer-demo-vpc

  ############################################################
  # Internet Gateway
  ############################################################

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: load-balancer-demo-igw

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVPC
      InternetGatewayId: !Ref InternetGateway

  ############################################################
  # Subnets
  ############################################################

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: load-balancer-demo-subnet-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: load-balancer-demo-subnet-2

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: load-balancer-demo-subnet-3

  ############################################################
  # Route Table
  ############################################################

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVPC
      Tags:
        - Key: Name
          Value: load-balancer-demo-public-rt

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  ############################################################
  # ALB Security Group
  ############################################################

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic to Application Load Balancer
      VpcId: !Ref DemoVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: load-balancer-demo-alb-sg

  ############################################################
  # EC2 Security Group
  ############################################################

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP only from ALB
      VpcId: !Ref DemoVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: load-balancer-demo-ec2-sg

  ############################################################
  # EC2 User Data
  ############################################################

  EC2UserData:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:

        ImageId: !Ref AmazonLinuxAMI

        InstanceType: !Ref InstanceType

        SecurityGroupIds:
          - !Ref EC2SecurityGroup

        UserData:
          Fn::Base64: |
            #!/bin/bash

            dnf update -y
            dnf install -y httpd

            TOKEN=$(curl -X PUT \
              "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            INSTANCE_ID=$(curl -s \
              -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)

            PRIVATE_IP=$(curl -s \
              -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/local-ipv4)

            AZ=$(curl -s \
              -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            HOSTNAME=$(hostname)

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html>
            <head>
                <title>Load Balancer Demo</title>
            </head>
            <body>

                <h1>Load Balancer Demo</h1>

                <h2>Request served by:</h2>

                <p><strong>Instance ID:</strong> $INSTANCE_ID</p>
                <p><strong>Private IP:</strong> $PRIVATE_IP</p>
                <p><strong>Availability Zone:</strong> $AZ</p>
                <p><strong>Hostname:</strong> $HOSTNAME</p>

            </body>
            </html>
            EOF

            systemctl enable httpd
            systemctl start httpd

  ############################################################
  # EC2 Instances
  ############################################################

  EC2Instance1:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Ref PublicSubnet1
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2UserData
        Version: !GetAtt EC2UserData.LatestVersionNumber
      Tags:
        - Key: Name
          Value: load-balancer-demo-1

  EC2Instance2:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2UserData
        Version: !GetAtt EC2UserData.LatestVersionNumber
      Tags:
        - Key: Name
          Value: load-balancer-demo-2

  EC2Instance3:
    Type: AWS::EC2::Instance
    Properties:
      SubnetId: !Ref PublicSubnet3
      LaunchTemplate:
        LaunchTemplateId: !Ref EC2UserData
        Version: !GetAtt EC2UserData.LatestVersionNumber
      Tags:
        - Key: Name
          Value: load-balancer-demo-3

  ############################################################
  # Target Group
  ############################################################

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: load-balancer-demo-tg
      Port: 80
      Protocol: HTTP
      VpcId: !Ref DemoVPC
      TargetType: instance

      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2

      Targets:
        - Id: !Ref EC2Instance1
          Port: 80

        - Id: !Ref EC2Instance2
          Port: 80

        - Id: !Ref EC2Instance3
          Port: 80

  ############################################################
  # Application Load Balancer
  ############################################################

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: load-balancer-demo-alb
      Scheme: internet-facing
      Type: application

      SecurityGroups:
        - !Ref ALBSecurityGroup

      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3

      Tags:
        - Key: Name
          Value: load-balancer-demo-alb

  ############################################################
  # Listener
  ############################################################

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:

  LoadBalancerDNS:
    Description: DNS name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  LoadBalancerURL:
    Description: URL for testing the load balancer
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

  Instance1:
    Description: EC2 instance 1
    Value: !Ref EC2Instance1

  Instance2:
    Description: EC2 instance 2
    Value: !Ref EC2Instance2

  Instance3:
    Description: EC2 instance 3
    Value: !Ref EC2Instance3